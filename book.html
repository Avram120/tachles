<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תכל'ס | קביעת פגישה 2</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap">
<style>
:root {
  --bg: #161615; --bg-alt: #2A2926; --line: #3B3934; --text: #F5F0E6; --text-2: #BFB6A5;
  --gold: #C9974A; --gold-light: #EBCB85; --gold-mid: #DEB267; --cta: #F2C76E; --cta-text: #161615;
  --font: "Heebo", "Arial Hebrew", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
body { min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
header img { height: 34px; }
header .sec { font-size: 14px; color: var(--gold-mid); font-weight: 700; }
.progress { height: 4px; background: var(--bg-alt); }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #A27138, #C9974A, #EBCB85); transition: width .35s; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 18px 120px; }
.card { width: 100%; max-width: 640px; animation: in .35s ease; }
@keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.kicker { color: var(--gold-mid); font-weight: 700; font-size: 14px; margin-bottom: 10px; }
h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 900; line-height: 1.2; margin: 0 0 14px; }
h2 { font-size: clamp(21px, 4.2vw, 28px); font-weight: 900; line-height: 1.3; margin: 0 0 8px; }
.hint { color: var(--text-2); font-size: 16px; line-height: 1.6; margin: 0 0 22px; white-space: pre-line; }
.intro p { font-size: 18px; line-height: 1.7; color: var(--text); margin: 0 0 14px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; background: var(--bg-alt); color: var(--text); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; font: 500 17px/1.4 var(--font); cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--gold); }
.opt .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; }
.opt.multi .mk { border-radius: 6px; }
.opt.on { border-color: var(--cta); background: #34302a; }
.opt.on .mk::after { content: ""; width: 10px; height: 10px; border-radius: inherit; background: var(--cta); }
.opt.multi.on .mk::after { border-radius: 2px; }
input[type=text], input[type=tel], input[type=email], textarea { width: 100%; background: var(--bg-alt); color: var(--text); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; font: 500 18px/1.5 var(--font); outline: none; }
input:focus, textarea:focus { border-color: var(--gold); }
textarea { min-height: 130px; resize: vertical; }
.other { margin-top: 10px; }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; direction: ltr; }
.scale button { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg-alt); color: var(--text); font: 700 17px var(--font); cursor: pointer; }
.scale button.on { background: var(--cta); color: var(--cta-text); border-color: var(--cta); }
.scale-l { display: flex; justify-content: space-between; color: var(--text-2); font-size: 14px; margin-top: 8px; }
.nav { position: fixed; inset-inline: 0; bottom: 0; background: rgba(22,22,21,.96); border-top: 1px solid var(--line); padding: 14px 18px; display: flex; gap: 12px; justify-content: center; }
.nav .in { width: 100%; max-width: 640px; display: flex; gap: 12px; align-items: center; }
.btn { background: var(--cta); color: var(--cta-text); border: 0; border-radius: 12px; padding: 14px 26px; font: 900 18px var(--font); cursor: pointer; flex: 1; }
.btn:disabled { opacity: .4; cursor: default; }
.back { background: none; border: 1.5px solid var(--line); color: var(--text-2); border-radius: 12px; padding: 14px 18px; font: 700 16px var(--font); cursor: pointer; }
.err { color: #E59A7F; font-size: 15px; margin-top: 10px; min-height: 20px; }
.count { color: var(--text-2); font-size: 14px; white-space: nowrap; }
.done { text-align: center; }
.box { background: var(--bg-alt); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-top: 16px; }
.box-h { color: var(--gold-light); font-weight: 900; font-size: 18px; margin-bottom: 6px; }
.intro .box p { font-size: 16px; margin: 0 0 10px; }
.box ul { margin: 0 0 10px; padding-inline-start: 20px; font-size: 16px; line-height: 1.8; }
.box b { color: #fff; }
.link-btn { display: inline-block; background: transparent; color: var(--cta); border: 1.5px solid var(--cta); border-radius: 10px; padding: 10px 18px; font-weight: 900; font-size: 16px; text-decoration: none; }
.link-btn:hover { background: var(--cta); color: var(--cta-text); }
.done .big { font-size: 56px; margin-bottom: 10px; color: var(--gold-light); }
@media (max-width: 480px) { .scale { grid-template-columns: repeat(5, 1fr); } .opt { font-size: 16px; } }
.days { display: grid; gap: 14px; margin-top: 8px; }
.day-h { color: var(--gold-light); font-weight: 900; font-size: 17px; margin-bottom: 8px; }
.times { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.slot { justify-content: center; font-weight: 700; }
</style>
</head>
<body>
<header><img src="assets/logo-h.png" alt="תכל'ס"><span class="sec">פגישה 2</span></header>
<main style="align-items:flex-start"><div class="card" id="card"></div></main>

<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbyfNqdF4XrlUemWKVc1dCUyYaRAJHCGYlocfxmfi8ynfTGb0HX-zDVBTXCJJVT_FTpltg/exec";
var WA = "972532481888";
var P = new URLSearchParams(location.search);
var FIRST = (P.get("n") || "").trim();
var STORE = "tachles_book2_v1";
var card = document.getElementById("card");
var chosen = null, slots = [];
var me = {}; try { me = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) {}
if (!me.name && FIRST) me.name = FIRST;

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
var TZ = "Asia/Jerusalem";
function dayLabel(iso) { return new Date(iso).toLocaleDateString("he-IL", { timeZone: TZ, weekday: "long", day: "numeric", month: "numeric" }); }
function timeLabel(iso) { return new Date(iso).toLocaleTimeString("he-IL", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false }); }
function dayKey(iso) { return new Date(iso).toLocaleDateString("en-CA", { timeZone: TZ }); }
function first() { return (me.name || FIRST || "").split(" ")[0]; }
function waLink(t) { return "https://wa.me/" + WA + "?text=" + encodeURIComponent(t); }

function head(msg) {
  return '<div class="intro"><div class="kicker">פגישה 2 · חזון, מטרות ותוכנית עבודה</div><h1>' + (first() ? esc(first()) + ", " : "") + 'בוא נקבע את הפגישה השנייה</h1>' +
    '<p>פגישה של שעה בגוגל מיט. בוחרים מועד, ממלאים פרטים, וההזמנה עם הקישור לפגישה מגיעה למייל.</p>' + (msg ? '<p class="err" style="font-size:16px">' + msg + '</p>' : '') + '</div>';
}

function loadSlots(msg) {
  card.innerHTML = head(msg) + '<p class="hint">טוען מועדים פנויים...</p>';
  fetch(ENDPOINT + "?api=slots2&t=" + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) throw 0;
    slots = d.slots || []; showSlots(msg);
  }).catch(function () { failBox(); });
}

function failBox() {
  card.innerHTML = head() + '<div class="box"><div class="box-h">לא הצלחתי לטעון את היומן</div><p>אפשר לרענן את הדף, או פשוט לכתוב לי ונקבע יחד.</p>' +
    '<a class="link-btn" href="' + waLink("היי אברהם, אשמח לקבוע את הפגישה השנייה") + '" target="_blank" rel="noopener">לוואטסאפ ←</a></div>';
}

function showSlots(msg) {
  if (!slots.length) {
    card.innerHTML = head(msg) + '<div class="box"><div class="box-h">כרגע אין מועדים פנויים בשבועות הקרובים</div><p>כתוב לי ונמצא זמן.</p>' +
      '<a class="link-btn" href="' + waLink("היי אברהם, אשמח לקבוע את הפגישה השנייה") + '" target="_blank" rel="noopener">לוואטסאפ ←</a></div>';
    return;
  }
  var days = [], by = {};
  slots.forEach(function (s) { var k = dayKey(s); if (!by[k]) { by[k] = []; days.push(k); } by[k].push(s); });
  var h = head(msg) + '<div class="days">' + days.map(function (k) {
    return '<div class="day"><div class="day-h">' + esc(dayLabel(by[k][0])) + '</div><div class="times">' +
      by[k].map(function (s) { return '<button type="button" class="opt slot" data-s="' + s + '">' + timeLabel(s) + '</button>'; }).join("") + '</div></div>';
  }).join("") + '</div>';
  card.innerHTML = h;
  card.querySelectorAll(".slot").forEach(function (b) { b.onclick = function () { chosen = b.dataset.s; showForm(); window.scrollTo(0, 0); }; });
}

function showForm(err) {
  card.innerHTML = head() + '<div class="box"><div class="box-h">' + esc(dayLabel(chosen)) + ' · ' + timeLabel(chosen) + '</div>' +
    '<p style="margin:0"><button type="button" class="back" id="chg" style="padding:8px 14px;font-size:14px">לבחירת מועד אחר</button></p></div>' +
    '<div style="display:grid;gap:12px;margin-top:18px">' +
    '<input id="f-name" type="text" placeholder="שם מלא" autocomplete="name" value="' + esc(me.name || "") + '">' +
    '<input id="f-phone" type="tel" placeholder="טלפון" autocomplete="tel" value="' + esc(me.phone || "") + '">' +
    '<input id="f-email" type="email" placeholder="מייל (לשם תגיע ההזמנה)" autocomplete="email" value="' + esc(me.email || "") + '">' +
    '<div class="err" id="err">' + (err || "") + '</div>' +
    '<button type="button" class="btn" id="go">לקביעת הפגישה</button></div>';
  document.getElementById("chg").onclick = function () { showSlots(); };
  document.getElementById("go").onclick = book;
}

function book() {
  var name = document.getElementById("f-name").value.trim(), phone = document.getElementById("f-phone").value.trim(), email = document.getElementById("f-email").value.trim();
  var err = document.getElementById("err");
  if (!name) { err.textContent = "צריך שם"; return; }
  if (phone.replace(/\D/g, "").length < 9) { err.textContent = "מספר הטלפון קצר מדי"; return; }
  if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = "נראה שחסר משהו בכתובת המייל"; return; }
  me = { name: name, phone: phone, email: email }; try { localStorage.setItem(STORE, JSON.stringify(me)); } catch (e) {}
  var b = document.getElementById("go"); b.disabled = true; b.textContent = "קובע...";
  fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ form: "book2", name: name, phone: phone, email: email, start: chosen }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) return done();
      if (d.error === "taken") return loadSlots("המועד הזה נתפס בינתיים. בחר מועד אחר.");
      showForm("משהו השתבש. נסה שוב, או כתוב לי בוואטסאפ.");
    })
    .catch(function () { showForm("משהו השתבש. נסה שוב, או כתוב לי בוואטסאפ."); });
}

function done() {
  card.innerHTML = '<div class="done"><div class="big">✓</div><h1>הפגישה נקבעה!</h1>' +
    '<p class="hint" style="font-size:20px;color:var(--text)">' + esc(dayLabel(chosen)) + ' · ' + timeLabel(chosen) + '</p>' +
    '<p class="hint" style="font-size:18px">הזמנה עם הקישור לפגישה נשלחה אל ' + esc(me.email) + '. כדאי לאשר אותה, כדי שהפגישה תופיע אצלך ביומן.</p>' +
    '<p class="hint" style="font-size:17px">לקראת הפגישה, כדאי לחשוב על שאלה אחת: <b style="color:#fff">איך נראה העסק שלך בעוד 3 שנים?</b></p>' +
    '<p class="hint">בוא נדבר תכל\'ס.<br>אברהם גוטפרב</p></div>';
}

loadSlots();
</script>
</body>
</html>
